{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h3>Add Result</h3>
        </div>

        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-success">
                    Save Result
                </button>

                <a href="{% url 'result_list' %}" class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>
    </div>
</div>

{% endblock %}
