{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-danger text-white">
            <h4>Delete Attendance</h4>
        </div>

        <div class="card-body">

            <h5>
                Are you sure you want to delete attendance of
                <strong>{{ attendance.student.name }}</strong> ?
            </h5>

            <br>

            <form method="POST">
                {% csrf_token %}

                <button class="btn btn-danger">
                    Yes Delete
                </button>

                <a href="{% url 'attendance_list' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
