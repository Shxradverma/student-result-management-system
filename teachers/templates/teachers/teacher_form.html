{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Add Teacher</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-primary">
            Save Teacher
        </button>

        <a href="{% url 'teacher_list' %}" class="btn btn-secondary">
            Back
        </a>

    </form>

</div>

{% endblock %}
